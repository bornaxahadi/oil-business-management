<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Oil Offer Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Settings (email + WhatsApp) are in the CONFIG block at the top of the script */
:root{
  --bg:#EEEAE0; --ink:#1B1B1B; --soft:#F8F5EE; --line:#D9D3C5; --muted:#6E6A61;
  --purple:#6A4CF5; --yellow:#FFC83D; --lime:#CDD97A; --red:#D8483E; --white:#fff;
  --r-xl:34px; --r-lg:24px; --r-md:18px;
}
html[data-theme=sky]{--bg:#E3EBF1;--soft:#F1F5F8;--line:#C7D3DC;--muted:#5C6973}
html[data-theme=dark]{--bg:#121212;--ink:#F1EEE7;--soft:#272727;--line:#3A3A3A;--muted:#A8A294;--white:#1E1E1E;color-scheme:dark}
html[data-theme=dark] .cat.dark{background:#2C2C2C!important}
html[data-theme=dark] #resume{background:var(--white)!important}
html[data-theme=dark] .chip.cust{color:#5BD07F;border-color:#3FB765}
html[data-theme=dark] .sbtn:not([style*="color"]){color:#1B1B1B}
html[data-theme=dark] .stagecard{box-shadow:inset 0 0 0 1px #ffffff14}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Urbanist',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 18px 120px;position:relative}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.mark{color:var(--white);width:52px;height:52px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.mark svg{width:24px;height:24px}
.top h4{font-size:17px;font-weight:700;line-height:1.1}
.top small{color:var(--muted);font-size:13px}
.circ{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none;background:transparent}
.circ.solid{background:var(--white);border-color:var(--white)}
.circ svg{width:20px;height:20px}
.ml{margin-left:auto}

.hero{font-size:44px;line-height:.95;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.lede{color:var(--muted);font-size:15px;max-width:30ch;margin-bottom:22px}

/* stacked category cards */
.stack{display:flex;flex-direction:column}
.cat{display:flex;align-items:center;gap:14px;padding:18px 18px 34px;border-radius:var(--r-xl) var(--r-xl) 0 0;margin-top:-18px;text-align:left;width:100%;position:relative}
.cat:first-child{margin-top:0}
.cat:last-child{border-radius:var(--r-xl);padding-bottom:18px}
.cat .ic{width:46px;height:46px;border-radius:50%;background:var(--white);display:grid;place-items:center;flex:none;font-size:20px}
.cat b{font-size:21px;font-weight:600}
.cat span.sub{display:block;font-size:13px;opacity:.75;font-weight:500}
.cat .go{margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--white);display:grid;place-items:center;flex:none}
.cat .go svg{width:18px;height:18px;stroke:var(--ink)}
.cat.dark .go{background:var(--white)}
.cat.light .ic,.cat.light .go{background:var(--bg)}

/* stage header */
.stagecard{border-radius:var(--r-lg);padding:16px 18px 20px;margin-bottom:14px;position:relative}
.pill{display:inline-block;background:var(--ink);color:var(--white);font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px}
.stagecard.dark .pill{background:var(--white);color:var(--ink)}
.stagecard h2{font-size:32px;font-weight:700;line-height:1.05;margin:12px 0 6px;letter-spacing:-.3px}
.stagecard p{font-size:14px;opacity:.85;max-width:34ch}
.prog{display:flex;gap:6px;margin:0 0 18px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--ink)}

/* question blocks */
.q{background:var(--white);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qh label{font-weight:700;font-size:16px}
.qh .hint{color:var(--muted);font-size:13px;font-weight:500}
.dk{margin-left:auto;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;border:1.5px dashed var(--muted);color:var(--muted);flex:none}
.dk.on{background:var(--ink);color:var(--white);border:1.5px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:99px;background:var(--soft);border:1.5px solid var(--soft);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chip.cust{border:2px dotted #22A04B;color:#16803A;background:var(--white)}
.chip.cust.on{background:#22A04B;color:#fff;border:2px solid #22A04B}
.chip.unk{border:1.5px dashed var(--muted);background:transparent;color:var(--muted)}
.chip.unk.on{background:var(--ink);color:var(--white);border-style:solid;border-color:var(--ink)}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.chip.on .tick::before{content:'✓'}
input.f,textarea.f,select.f{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:500}
input.f:focus,textarea.f:focus{border-color:var(--ink);outline:none;background:var(--white)}
input.f:disabled{opacity:.5}
textarea.f{min-height:90px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mt8{margin-top:8px}
.pricegrid{display:grid;gap:8px}
.pricerow{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:4px 4px 4px 14px}
.pricerow b{width:62px;font-size:14px}
.pricerow input{flex:1;border:0;background:var(--white);border-radius:11px;padding:11px 12px;font-size:16px;font-weight:600;min-width:0}
.files{border:2px dashed var(--line);border-radius:var(--r-md);padding:18px;text-align:center;display:block;font-weight:600}
.perks{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.perks span{background:var(--white);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.prices small{display:block;font-size:11px;font-weight:600;opacity:.8;max-width:260px;text-align:right;margin-top:2px}
.logobox{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:12px}
.logobox img{max-height:56px;max-width:130px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;margin-right:auto}
.lbtn{font:700 13px 'Urbanist',sans-serif;background:var(--white);border:0;border-radius:99px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.logoup{font-size:22px}.logoup b{display:block;font-size:15px;margin-top:4px}
.forget{display:block;margin-top:10px;font:600 12px 'Urbanist',sans-serif;color:var(--muted);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.dpick{background:var(--white);border-radius:var(--r-lg);padding:14px 14px 12px}
.dph{display:flex;align-items:center;margin-bottom:10px}.dph b{font-size:16px}
.dph button{margin-left:auto;background:var(--soft);border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px}
.dopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dopt{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:8px 4px;border-radius:16px;border:2px solid transparent}
.dopt.on{border-color:var(--ink)}
.dopt i{width:58px;height:76px;border-radius:6px;box-shadow:0 0 0 1px #0002;padding:6px 5px;display:flex;flex-direction:column;gap:4px}
.dopt em{height:18px;border-radius:4px}.dopt u{height:12px;border-radius:3px;background:#8884}
.pv{position:fixed;inset:0;z-index:50;background:#000d;overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 30px}
.pvbar{display:flex;align-items:center;color:#fff;margin-bottom:10px}.pvbar button{margin-left:auto;background:#fff;color:#1B1B1B;border-radius:99px;padding:8px 14px;font-weight:700}
.pv img{width:100%;border-radius:10px;display:block}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--white);border:0;border-radius:20px;padding:14px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.mini b{display:block;font-size:16px}.mini small{display:block;font-size:12px;opacity:.7;margin-top:2px}
.hist{background:var(--white);border-radius:20px;padding:14px 14px 14px 16px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.hist small{display:block;font-size:12px;color:var(--muted)}.hist b{display:block;font-size:19px;margin:2px 0}.hist span{display:block;font-size:13px;font-weight:600}
.hist .hb{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.hist .hb button{border:0;border-radius:99px;background:var(--soft);padding:7px 12px;font:700 12px 'Urbanist',sans-serif;cursor:pointer;color:var(--ink)}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtns .files{padding:16px 8px;font-size:22px}
.fbtns .files b{display:block;font-size:15px;margin-top:4px}
.fbtns.full .files{opacity:.4}
.fcount{display:block;margin-top:8px}
.files small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.flist{margin-top:10px;display:grid;gap:6px}
.flist div{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:14px}
.flist div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist button{font-weight:700;padding:0 6px}
.err{color:var(--red);font-size:14px;font-weight:600;margin-top:8px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .in{max-width:444px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;height:58px;border-radius:99px;background:var(--ink);color:var(--white);font-size:18px;font-weight:600}
.btn.ghost{background:var(--white);color:var(--ink);flex:0 0 58px}
.btn:disabled{opacity:.5}

/* review */
.sum{background:var(--white);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.sum h3{font-size:18px;margin-bottom:10px;display:flex;align-items:center}
.sum h3 button{margin-left:auto;font-size:13px;font-weight:700;background:var(--soft);padding:6px 12px;border-radius:99px}
.kv{display:grid;grid-template-columns:42% 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{font-weight:600;word-break:break-word}
.kv dd.u{color:var(--muted);font-weight:500;font-style:italic}
.score{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--white);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px}
.score b{font-size:40px;font-weight:800;line-height:1}
.score p{font-size:14px;opacity:.85}
.send{display:grid;gap:10px;margin-top:6px}
.sbtn{display:flex;align-items:center;gap:14px;border-radius:var(--r-lg);padding:16px 18px;text-align:left;width:100%;font-weight:700;font-size:18px}
.sbtn small{display:block;font-size:13px;font-weight:500;opacity:.8}
.sbtn .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.sbtn .go svg{width:18px;height:18px;stroke:#1B1B1B}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:15px;z-index:50;max-width:90vw;text-align:center}
.done{text-align:center;padding-top:40px}
.done .big{width:96px;height:96px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 18px;font-size:44px}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .28s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}

/* ================= PDF SHEET (off-screen) ================= */
#sheet{position:fixed;left:-10000px;top:0;width:794px;background:#EEEAE0;font-family:'Urbanist',sans-serif;color:#1B1B1B;padding:34px}
#sheet .sh-top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
#sheet .sh-top .m{color:#fff;width:46px;height:46px;border-radius:50%;background:#1B1B1B;display:grid;place-items:center}
#sheet .sh-top h1{font-size:15px;font-weight:700}
#sheet .sh-top p{font-size:12px;color:#6E6A61}
#sheet .sh-ref{margin-left:auto;text-align:right;font-size:12px}
#sheet .sh-ref b{display:block;font-size:16px}
#sheet .sh-hero{border-radius:28px;padding:24px 26px;margin-bottom:14px;display:flex;gap:20px;align-items:flex-end}
#sheet .sh-hero h2{font-size:40px;line-height:1;font-weight:800;margin:10px 0 6px}
#sheet .sh-hero .tag{display:inline-block;background:#1B1B1B;color:#fff;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px}
#sheet .sh-hero.dark .tag{background:#fff;color:#1B1B1B}
#sheet .sh-hero .prices{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
#sheet .sh-hero .prices div{background:#fff;color:#1B1B1B;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
#sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#sheet .box{background:#fff;border-radius:20px;padding:16px 18px;break-inside:avoid}
#sheet .box h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
#sheet .box h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
#sheet .box table{width:100%;border-collapse:collapse;font-size:12.5px}
#sheet .box td{padding:4px 0;vertical-align:top}
#sheet .box td:first-child{color:#6E6A61;width:44%}
#sheet .box td:last-child{font-weight:600}
#sheet .box td.u{color:#A09A8C;font-weight:500;font-style:italic}
#sheet .full{grid-column:1/-1}
#sheet .docs{display:flex;flex-wrap:wrap;gap:6px}
#sheet .docs span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:#F8F5EE}
#sheet .docs span.y{background:#1B1B1B;color:#fff}
#sheet .meter{height:10px;border-radius:9px;background:#EEEAE0;overflow:hidden;margin-top:8px}
#sheet .meter i{display:block;height:100%;background:#1B1B1B}
#sheet .sh-top .lg{max-height:58px;max-width:170px;object-fit:contain}
#sheet .sh-top.lh h1{font-size:21px;font-weight:800}
#sheet .sh-top.lh .sh-ref b{letter-spacing:.08em}
#sheet .sig .sigrow{display:flex;gap:18px;align-items:center}
#sheet .sig img{max-height:64px;max-width:130px;object-fit:contain}
#sheet .sig small{display:block;font-size:11px;color:#6E6A61}
#sheet .sig b{display:block;font-size:19px;font-weight:800;margin:2px 0}
#sheet .sig span{display:block;font-size:12.5px;margin-top:2px}
#sheet .sig .sigline{margin-left:auto;align-self:flex-end;border-top:1.5px solid #1B1B1B;padding-top:6px;width:190px;text-align:center;font-size:11px;color:#6E6A61}
#sheet .sig .notes{font-size:12.5px;margin-top:12px}
#sheet .sig .notes b{display:inline;font-size:12.5px;font-weight:700;margin:0}
#sheet.d-letter{background:#fff}
#sheet.d-letter .box{border:1px solid #E2DCCF;border-radius:10px}
#sheet.d-letter .sh-hero{background:#fff!important;color:#1B1B1B!important;border:0!important;border-top:4px solid #1B1B1B!important;border-bottom:1px solid #1B1B1B!important;border-radius:0;padding:20px 2px 18px}
#sheet.d-letter .sh-hero .tag{background:#1B1B1B;color:#fff}
#sheet.d-letter .sh-hero .prices div{background:#F3F0E9}
#sheet.d-letter .docs span{background:#F3F0E9}
#sheet.d-letter .docs span.y{background:#1B1B1B;color:#fff}
#sheet.d-letter .box h3 i{display:none}
#sheet.d-dark{background:#111;color:#EEEAE2}
#sheet.d-dark .box{background:#1E1E1E}
#sheet.d-dark .box td:first-child,#sheet.d-dark .sh-top p,#sheet.d-dark .foot,#sheet.d-dark .sig small,#sheet.d-dark .sig .sigline{color:#9D978B}
#sheet.d-dark .box td.u{color:#6F6A61}
#sheet.d-dark .docs span{background:#2A2A2A;color:#E6E2DA}
#sheet.d-dark .docs span.y{background:#EEEAE2;color:#111}
#sheet.d-dark .sig .sigline{border-color:#EEEAE2}
#sheet.d-dark .sh-top .m{background:#EEEAE2;color:#111}
#sheet.d-dark .sh-hero{border:1px solid #ffffff2a}
#sheet.d-dark .box h3 i{box-shadow:0 0 0 1px #ffffff55}
#sheet.d-dark img.lg,#sheet.d-dark .sig img{background:#fff;border-radius:10px;padding:6px}
#sheet .foot{margin-top:16px;font-size:11px;color:#6E6A61;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="app" id="app"></div>

setTheme(THEME);
let DESIGN=localStorage.getItem('oilDesign')||'colour';
const DESIGNS=[['colour','Colour','#EEEAE0'],['letter','Letterhead','#FFFFFF'],['dark','Dark','#111111']];

const lkey = (i,f) => (i===0?S.cat:'*')+'|'+f.id;
const optsOf = (f,i) => { const extra=(LEARNED[lkey(i,f)]||[]).filter(o=>!f.options.some(x=>x.toLowerCase()===o.toLowerCase())); return f.options.concat(extra); };
async function loadLearned(){
  if(!CONFIG.scriptUrl) return;
  try{ const r=await fetch(CONFIG.scriptUrl+'?learned=1'); const j=await r.json();
    if(j&&j.ok&&j.options){ LEARNED=j.options; localStorage.setItem('oilLearned',JSON.stringify(LEARNED)); if(view==='form') render(); } }catch(e){}
}
const esc = v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PKEYS=['cname','company','role','phone','email','address','website'];
let PROFILE={ans:{},logo:''}; try{ PROFILE=Object.assign(PROFILE,JSON.parse(localStorage.getItem('oilProfile')||'{}')) }catch(e){}
const saveProfile=()=>{ PKEYS.forEach(k=>{ const v=S.ans[k]; if(v&&v!==DK) PROFILE.ans[k]=v; }); try{localStorage.setItem('oilProfile',JSON.stringify(PROFILE))}catch(e){ toast('Logo too large to save, try a smaller image') } };
const save=()=>{try{localStorage.setItem('oilOfferDraft',JSON.stringify({cat:S.cat,ans:S.ans}))}catch(e){} saveProfile();};
const load=()=>{try{const d=JSON.parse(localStorage.getItem('oilOfferDraft')||'null');if(d&&d.cat){S.cat=d.cat;S.ans=d.ans||{}}}catch(e){}};
const cat = ()=>CATS.find(c=>c.id===S.cat);

const visible = (f)=>!f.showIf || f.showIf(S.ans);

function toast(t,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

/* ---------------- render ---------------- */
function render(){
  const app=$('#app'); window.scrollTo(0,0);
  if(view==='home') return renderHome(app);
  if(view==='form') return renderForm(app);
  if(view==='review') return renderReview(app);
  if(view==='done') return renderDone(app);
  if(view==='history') return renderHistory(app);
}
function topbar(left){
  return `<div class="top">${left}</div>`;
}
function renderHome(app){
  $('#bar').hidden=true;
  const draft = S.cat && Object.keys(S.ans).length;
  app.innerHTML = `<div class="screen">
   ${topbar(`<div class="mark">${drop}</div><div><h4>${esc(CONFIG.brandName)}</h4><small>Offer intake</small></div><button class="circ ml" id="themeBtn" aria-label="Colour mode" title="Colour mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg></button>`)}
   <h1 class="hero">NEW OIL<br>OFFER</h1>
   <p class="lede">Choose the product being offered. It takes about two minutes.</p>
   <div class="perks"><span>✓ Mostly tick boxes</span><span>✓ "Don't know" is fine</span><span>✓ Attach PDF &amp; photos</span></div>
   ${draft?`<button class="sbtn" style="background:#fff;margin-bottom:14px" id="resume"><div>Continue draft<small>${esc(cat().name)} offer in progress</small></div><span class="go">${arrow}</span></button>`:''}
   ${HIST().length?`<button class="sbtn" style="background:#1B1B1B;color:#fff;margin-bottom:14px" id="myOffers"><div>My offers<small>${HIST().length} saved · open again or reuse</small></div><span class="go">${arrow}</span></button>`:''}
   <div class="stack">${CATS.map(c=>`<button class="cat ${c.dark?'dark':''} ${c.bg==='#FFFFFF'?'light':''}" data-c="${c.id}" style="background:${c.bg};color:${c.fg}">
     <span class="ic">${c.icon}</span><span><b>${c.name}</b><span class="sub">${c.sub}</span></span><span class="go">${arrow}</span></button>`).join('')}</div>
  </div>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{ if(S.cat!==b.dataset.c){S={cat:b.dataset.c,ans:{currency:'USD',per:'MT',...PROFILE.ans},files:[]}} view='form';step=0;save();render(); });
  const r=$('#resume'); if(r) r.onclick=()=>{view='form';step=0;render()};
  const mo=$('#myOffers'); if(mo) mo.onclick=()=>{view='history';render()};
  $('#themeBtn').onclick=()=>{ const t=THEMES[(THEMES.indexOf(THEME)+1)%THEMES.length]; setTheme(t); toast({cream:'Cream mode',sky:'Sky mode',dark:'Dark mode'}[t],1400); };
}

function renderForm(app){
  const st=STAGES[step], c=cat();
  const color = step===0 ? {bg:c.bg,fg:c.fg,dark:c.dark} : st;
  app.innerHTML = `<div class="screen">
   ${topbar(`<button class="circ" id="bk" aria-label="Back">${back}</button><div style="margin:0 auto;text-align:center"><h4>${esc(c.name)} offer</h4><small>Stage ${step+1} of ${STAGES.length}</small></div><button class="circ" id="hm" aria-label="Start over" title="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>`)}
   <div class="prog">${STAGES.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
   <div class="stagecard ${color.dark?'dark':''}" style="background:${color.bg};color:${color.fg};${color.bg==='#FFFFFF'?'border:1.5px solid var(--line)':''}">
     <span class="pill">Stage ${step+1}</span><h2>${st.title}</h2><p>${st.text}</p></div>
   <div id="qs"></div><div class="err" id="err"></div>
  </div>`;
  drawQs();
  $('#bk').onclick=()=>{ if(step===0){view='home'} else step--; render(); };
  $('#hm').onclick=()=>{ if(confirm('Start a new offer? This clears the current answers.')){S={cat:null,ans:{},files:[]};save();view='home';render()} };
  bar([{t:back,ghost:true,fn:()=>{ if(step===0){view='home'} else step--; render(); }},{t:step===STAGES.length-1?'Review offer':'Next',fn:next}]);
}
function bar(btns){
  $('#bar').hidden=false;
  $('#barin').innerHTML = btns.map((b,i)=>`<button class="btn ${b.ghost?'ghost':''}" data-i="${i}" aria-label="${b.ghost?'Back':esc(b.t)}">${b.t}</button>`).join('');
  $('#barin').querySelectorAll('button').forEach(el=>el.onclick=btns[+el.dataset.i].fn);
}
function next(){
  const miss = fieldsFor(step).filter(f=>f.required && visible(f) && !S.ans[f.id]);
  if(step===STAGES.length-1 && !S.ans.phone && !S.ans.email){ $('#err').textContent='Add a WhatsApp number or an email so we can reply.'; return; }
  if(miss.length){ $('#err').textContent=`Please fill in: ${miss.map(f=>f.label).join(', ')}.`; return; }
  if(step<STAGES.length-1){step++;render()} else {view='review';render()}
}

function drawQs(){
  const box=$('#qs'); const A=S.ans;
  box.innerHTML = fieldsFor(step).filter(visible).map(f=>{
    const v=A[f.id], unk = v===DK;
    const dkBtn = (!f.noDK && !f.required && ['text','textarea','date','qty'].includes(f.type)) ? `<button class="dk ${unk?'on':''}" data-dk="${f.id}">Don't know</button>`:'';
    let body='';
    if(f.type==='chips'||f.type==='multi'){
      const sel = f.type==='multi' ? (Array.isArray(v)?v:[]) : v;
      const on = o=> f.type==='multi' ? sel.includes(o) : sel===o;
      body = `<div class="chips">${optsOf(f,step).map(o=>`<button class="chip ${on(o)?'on':''}" data-f="${f.id}" data-o="${esc(o)}">${f.swatch?`<span class="sw" style="background:${SWATCH[o]||'#ccc'}"></span>`:''}${esc(o)}</button>`).join('')}
        ${hasOther(f)?`<button class="chip cust ${on('__other')?'on':''}" data-f="${f.id}" data-o="__other">✎ Custom</button>`:''}
        ${f.noDK?'':`<button class="chip unk ${unk||(f.type==='multi'&&sel.includes(DK))?'on':''}" data-f="${f.id}" data-o="${DK}">Don't know</button>`}</div>
        ${hasOther(f)&&on('__other')?`<input class="f mt8" data-t="${f.id}_other" placeholder="Not in the list? Type your own answer" value="${esc(A[f.id+'_other'])}">`:''}`;
    } else if(f.type==='text'){
      body=`<input class="f" data-t="${f.id}" inputmode="${f.input==='decimal'?'decimal':f.input==='numeric'?'numeric':f.input==='tel'?'tel':'text'}" type="${f.input==='email'?'email':f.input==='tel'?'tel':'text'}" value="${unk?'':esc(v)}" ${unk?'disabled':''} placeholder="${unk?DK:''}">`;
    } else if(f.type==='textarea'){
      body=`<textarea class="f" data-t="${f.id}" ${unk?'disabled':''} placeholder="${unk?DK:''}">${unk?'':esc(v)}</textarea>`;
    } else if(f.type==='date'){
      body=`<input class="f" type="date" data-t="${f.id}" value="${unk?'':esc(v)}" ${unk?'disabled':''}>`;
    } else if(f.type==='qty'){
      const q = (v&&typeof v==='object')?v:{n:'',u:'MT'};
      body=`<div class="row"><input class="f" inputmode="decimal" data-qn="${f.id}" value="${unk?'':esc(q.n)}" ${unk?'disabled':''} placeholder="${unk?DK:'Amount'}"></div>
        <div class="chips mt8">${['MT','BBL','CBM','Litres','Gallons'].map(u=>`<button class="chip ${!unk&&q.u===u?'on':''}" data-qu="${f.id}" data-o="${u}">${u}</button>`).join('')}</div>`;
    } else if(f.type==='prices'){
      const p=A.prices||{};
      body=`<div class="pricegrid">${A.terms.filter(t=>t!==DK).map(t=>`<div class="pricerow"><b>${esc(termName(t,A))}</b><input inputmode="decimal" data-p="${t}" value="${esc(p[t])}" placeholder="${A.currency||'USD'} per ${A.per||'MT'}"></div>`).join('')||'<small class="hint">Pick a delivery term above.</small>'}</div>`;
    } else if(f.type==='logo'){
      body = (PROFILE.logo
        ? `<div class="logobox"><img src="${PROFILE.logo}" alt="logo"><label class="lbtn">Change<input type="file" id="logoIn" accept="image/*" hidden></label><button class="lbtn" id="logoRm">Remove</button></div>`
        : `<label class="files logoup">🏷️<b>Upload your logo</b><small>PNG or JPG</small><input type="file" id="logoIn" accept="image/*" hidden></label>`)
        + (Object.keys(PROFILE.ans).length||PROFILE.logo ? `<button class="forget" id="forgetMe">Saved on this phone · forget my details</button>` : '');
    } else if(f.type==='files'){
      const full=S.files.length>=MAXF;
      body=`<div class="fbtns ${full?'full':''}"><label class="files">📄<b>Files & PDF</b><small>PDF, Word, Excel</small><input type="file" class="fileIn" multiple hidden ${full?'disabled':''} accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,application/pdf"></label>
        <label class="files">📷<b>Product photos</b><small>Sample, tank, vessel, documents</small><input type="file" class="fileIn" multiple hidden ${full?'disabled':''} accept="image/*"></label></div>
        <small class="hint fcount">${S.files.length} of ${MAXF} files added · max 8 MB each</small>
        <div class="flist">${S.files.map((x,i)=>`<div><span>${esc(x.name)}</span><small>${(x.size/1024/1024).toFixed(1)} MB</small><button data-rm="${i}" aria-label="Remove">✕</button></div>`).join('')}</div>`;
    }
    return `<div class="q"><div class="qh"><label>${esc(f.label)}${f.required?' *':''}</label>${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}${dkBtn}</div>${body}</div>`;
  }).join('');

  box.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const f=fieldsFor(step).find(x=>x.id===b.dataset.f), o=b.dataset.o;
    if(f.type==='multi'){
      let arr=Array.isArray(A[f.id])?A[f.id]:[];
      if(o===DK) arr = arr.includes(DK)?[]:[DK];
      else { arr=arr.filter(x=>x!==DK); arr = arr.includes(o)?arr.filter(x=>x!==o):[...arr,o]; }
      A[f.id]=arr;
    } else A[f.id] = A[f.id]===o ? '' : o;
    if(f.id==='per') A._perSet=true;
    save(); drawQs();
  });

const nice=n=>{const x=String(n).replace(/,/g,'').trim(); return /^\d+(\.\d+)?$/.test(x)?Number(x).toLocaleString('en-US'):n;};
const termName=(t,A)=>t==='__other'?(A.terms_other||'Custom term'):t;
function fmt(f,A){
  let v=A[f.id];
  if(f.type==='prices'){ const p=A.prices||{}; const out=(A.terms||[]).filter(t=>t!==DK&&p[t]).map(t=>`${termName(t,A)} ${A.currency||'USD'} ${nice(p[t])}/${A.per||'MT'}`); return out.join(' · ')||''; }
  if(v==='__other') return A[f.id+'_other']||'';
  if(Array.isArray(v)) return v.map(x=>x==='__other'?(A[f.id+'_other']||''):x).filter(Boolean).join(', ');
  if(v&&typeof v==='object') return v.n?`${nice(v.n)} ${v.u||''}`.trim():'';
  if(f.type==='date'&&/^\d{4}-\d\d-\d\d$/.test(v||'')) return new Date(v+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  return v||'';
}
const OUT={'Which region?':'Region','Light or heavy?':'Gravity','Sweet or sour?':'Sulphur','Virgin or recycled?':'Condition',
  'Where is the product?':'Location','Which Platts benchmark?':'Platts benchmark','Broker commission?':'Broker commission',
  'Destination port / country':'Destination','You are the':'Role','Your name':'Name','WhatsApp number':'WhatsApp','Anything else':'Notes',
  'Price for each term':'Prices','Offer valid until':'Valid until','Product owner (company)':'Product owner','Vessel position now':'Vessel position'};
const hasOther = f => (f.type==='chips'||f.type==='multi') && f.other!==false && !f.noDK;
function customEntries(){
  const A=S.ans, out=[];
  STAGES.forEach((st,i)=>fieldsFor(i).filter(f=>visible(f)&&hasOther(f)).forEach(f=>{
    const v=A[f.id], picked = Array.isArray(v)?v.includes('__other'):v==='__other', t=(A[f.id+'_other']||'').trim();
    if(picked&&t) out.push({q:(i===0?cat().name+' — ':'')+f.label, v:t, key:lkey(i,f)});
  }));
  return out;
}
function sections(){
  const A=S.ans, out=[];
  STAGES.forEach((st,i)=>{
    const rows = fieldsFor(i).filter(f=>visible(f)&&f.type!=='files').map(f=>({k:f.label,v:fmt(f,A)}));
    rows.forEach(r=>{ if(OUT[r.k]) r.k=OUT[r.k]; });
    { const lg=rows.findIndex(r=>r.k==='Company logo'); if(lg>-1) rows.splice(lg,1); }
    if(i===0){ const gl=(cat().fields.find(f=>f.id==='grade')||{}).label; rows.forEach(r=>{ if(r.k===gl) r.k='Product name / grade'; }); rows.unshift({k:'Product',v:cat().name}); }
    if(i===4) rows.push({k:'Attached files',v:S.files.map(f=>f.name).join(', ')});
    out.push({title:st.title, bg:i===0?cat().bg:st.bg, rows, i});
  });
  return out;
}
function completeness(){
  let t=0,a=0; sections().forEach(s=>s.rows.forEach(r=>{t++; if(r.v && r.v!==DK) a++;})); return Math.round(a/t*100);
}

async function makePdf(asImage){
  if(typeof html2canvas==='undefined'||!window.jspdf){toast('PDF tool is still loading — try again in a moment');throw new Error('no pdf lib')}
  buildSheet(); await document.fonts.ready;
  const el=$('#sheet'), old=el.getAttribute('style')||'', y=window.scrollY; el.className='d-'+DESIGN;
  // render the sheet in the page (behind the app) so the capture is not blank
  el.setAttribute('style','position:absolute;left:0;top:0;z-index:-1;');
  await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  try{
    const W=794, H=el.scrollHeight, sc=Math.min(2, Math.sqrt(14e6/(W*H)));
    const canvas=await html2canvas(el,{scale:sc,backgroundColor:(DESIGNS.find(d=>d[0]===DESIGN)||DESIGNS[0])[2],width:W,height:H,windowWidth:W,scrollX:0,scrollY:0,useCORS:true,logging:false});
    if(asImage) return await new Promise(r=>canvas.toBlob(r,'image/jpeg',.92));
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'px',format:[W,H],orientation:H>W?'p':'l',hotfixes:['px_scaling']});
    pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,W,H);
    return pdf.output('blob');
  } finally { el.setAttribute('style',old); window.scrollTo(0,y); }
}

    price: fmt({id:'prices',type:'prices'},A), contactName: val('cname'), company: val('company'),
    phone: val('phone'), email: val('email'), completeness: completeness()+'%',
    sections: sections().map(s=>({title:s.title,color:s.bg,rows:s.rows.map(r=>({k:r.k,v:r.v||''}))})),
    customs: customEntries(),
    text: summaryText().replace(/\*/g,'') };
}
const toB64 = blob => new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function notifyPhone(o){
  if(!CONFIG.ntfyTopic) return;
  try{ await fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:CONFIG.ntfyTopic,title:`New offer: ${o.product}`,
    message:[o.category,o.origin,o.quantity,o.price,`From ${o.contactName} ${o.phone}`.trim(),`Ref ${o.ref} · ${o.completeness} complete`].filter(Boolean).join('\n'),
    tags:['oil_drum'],priority:4})}) }catch(e){}
}
const emailReady = ()=> CONFIG.receiverEmail && !/YOUR_EMAIL/.test(CONFIG.receiverEmail);
async function sendEmail(){
  const btn=$('#sEmail'); btn.disabled=true; toast('Sending…',6000);
  let pdf; try{pdf=await makePdf()}catch(e){btn.disabled=false;return}
  const o=offerFields();
  if(CONFIG.scriptUrl){
    try{
      const files=[{name:ref+'.pdf',mime:'application/pdf',data:await toB64(pdf)}];
      for(const f of S.files) files.push({name:f.name,mime:f.type||'application/octet-stream',data:await toB64(f)});
      const r=await fetch(CONFIG.scriptUrl,{method:'POST',body:JSON.stringify({...o,files})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'failed');
      return finishSent();
    }catch(e){ console.warn(e); if(!emailReady()){btn.disabled=false;toast('Could not send. Check your connection and tap Send offer again.',4500);return} }
  }
  if(!emailReady()){btn.disabled=false;toast('Sending is not set up yet. Add scriptUrl or receiverEmail in CONFIG.',4500);return}
  await notifyPhone(o);
  sendFormSubmit(pdf);
}
function finishSent(){ remember(); try{localStorage.removeItem('oilOfferDraft')}catch(e){} view='done'; render(); }
function sendFormSubmit(pdf){
  const f=document.createElement('form'); f.method='POST'; f.enctype='multipart/form-data'; f.target='fsframe';
  f.action='https://formsubmit.co/'+encodeURIComponent(CONFIG.receiverEmail); f.style.display='none';
  const add=(n,v)=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i)};
  if(CONFIG.ccEmail) add('_cc',CONFIG.ccEmail);
  add('_subject',`New oil offer ${ref} — ${productTitle()}`); add('_captcha','false'); add('_template','table');
  if(S.ans.email&&S.ans.email!==DK) add('_replyto',S.ans.email);
  add('Reference',ref); add('Product',`${productTitle()} (${cat().name})`);
  sections().forEach(s=>s.rows.forEach(r=>add(`${s.title} — ${r.k}`, r.v||'—')));
  add('Completeness',completeness()+'%');
  const cu=customEntries(); if(cu.length){ add('★ NEW OPTIONS to add to the app', cu.map(c=>`${c.q}: ${c.v}`).join(' | ')); f.querySelector('[name=_subject]').value+=' ★ new options'; }
  const allFiles=[new File([pdf],ref+'.pdf',{type:'application/pdf'}),...S.files];
  allFiles.forEach((file,i)=>{const inp=document.createElement('input');inp.type='file';inp.name='attachment'+(i+1);const dt=new DataTransfer();dt.items.add(file);inp.files=dt.files;f.appendChild(inp)});
  document.body.appendChild(f);
  $('#fsframe').onload=()=>{f.remove(); finishSent();};
  f.submit();
}

function renderDone(app){
  $('#bar').hidden=true;
  app.innerHTML=`<div class="screen done">
   <div class="big">✓</div><h1 class="hero" style="font-size:40px">OFFER SENT</h1>
   <p class="lede" style="margin:8px auto 24px">Reference ${ref}. We’ll reply on WhatsApp or email after checking the details.</p>
   <div class="send"><button class="sbtn" style="background:#CDD97A" id="sShare"><div>Share your PDF<small>Keep a copy or send it to others</small></div><span class="go">${arrow}</span></button>
   <button class="sbtn" style="background:#FFC83D" id="sWa"><div>Also send on WhatsApp<small>Summary to our desk</small></div><span class="go">${arrow}</span></button>
   <button class="sbtn" style="background:#1B1B1B;color:#fff" id="again"><div>Send another offer</div><span class="go">${arrow}</span></button></div></div>`;
  $('#sWa').onclick=sendWa; $('#sShare').onclick=sharePdf; $('#again').onclick=()=>{S={cat:null,ans:{},files:[]};ref='';view='home';render()};
}

load(); loadLearned(); render();
</script>
</body>
</html>
